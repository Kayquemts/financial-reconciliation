version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: batch-postgres
    environment:
      POSTGRES_USER: ${BATCH_USER}
      POSTGRES_PASSWORD: ${BATCH_PASSWORD}
      POSTGRES_DB: ${BATCH_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always